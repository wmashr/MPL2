<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Premier League - Voting Portal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'shimmer': 'shimmer 1.5s infinite',
          },
          keyframes: {
            shimmer: {
              '100%': { transform: 'translate3d(100%, 0, 0)' }
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      overflow-x: hidden;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    
    .glass-card:hover {
      border-color: rgba(168, 85, 247, 0.5);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 40px -15px rgba(168, 85, 247, 0.3);
    }
    
    .noise-bg {
      position: absolute;
      inset: 0;
      background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');
      opacity: 0.03;
      mix-blend-mode: overlay;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen w-full font-sans selection:bg-purple-500/30">

  <!-- Dynamic Background -->
  <div class="fixed inset-0 z-0 pointer-events-none">
    <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-purple-900/20 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-blue-900/20 blur-[120px] rounded-full"></div>
    <div class="noise-bg"></div>
  </div>

  <div class="relative z-10 container mx-auto px-4 py-16 md:py-24 max-w-7xl">
    <!-- Header Section -->
    <div class="text-center mb-20 space-y-6">
      <div class="inline-flex items-center justify-center space-x-2 bg-white/5 border border-white/10 px-4 py-1.5 rounded-full backdrop-blur-md mb-4">
        <i data-lucide="sparkles" class="w-4 h-4 text-purple-400"></i>
        <span class="text-xs font-medium tracking-widest uppercase text-purple-200">Official Voting Portal</span>
      </div>
      
      <h1 class="text-5xl md:text-7xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white via-purple-200 to-blue-400 drop-shadow-sm pb-2">
        MASTER PREMIER LEAGUE
      </h1>
      
      <p class="text-neutral-400 text-lg md:text-xl max-w-2xl mx-auto font-light">
        Support your favorite team. The battle for glory begins now. Every vote counts towards the ultimate championship.
      </p>
    </div>

    <!-- Teams Grid -->
    <div id="teams-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8 md:gap-12">
      <!-- Generated via JS -->
    </div>
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Mock Data
    const TEAMS = [
      {
        id: 'team_1',
        name: 'Kandy Kings',
        captain: 'Sahan Perera',
        whatsapp: '+94 77 123 4567',
        batch: '27 Kandy',
        logo: './public/images/mpl/mpl_team_logo_1_1789493685316.jpg',
        captainPhoto: './public/images/mpl/mpl_captain_1_1789493715125.jpg',
        votes: 1240,
        slogan: 'Roar to Victory!',
        hasVoted: false
      },
      {
        id: 'team_2',
        name: 'Colombo Titans',
        captain: 'Dinuka Silva',
        whatsapp: '+94 71 987 6543',
        batch: '28 Colombo',
        logo: './public/images/mpl/mpl_team_logo_2_1789493700611.jpg',
        captainPhoto: './public/images/mpl/mpl_captain_2_1789493728706.jpg',
        votes: 1105,
        slogan: 'Unstoppable Force.',
        hasVoted: false
      }
    ];

    const grid = document.getElementById('teams-grid');

    function renderTeams() {
      grid.innerHTML = '';
      
      TEAMS.forEach((team, index) => {
        const card = document.createElement('div');
        card.className = "group relative glass-card rounded-3xl overflow-hidden transition-all duration-500";
        
        card.innerHTML = \`
          <!-- Logo / Cover Image Area -->
          <div class="relative h-72 w-full overflow-hidden bg-neutral-900">
            <img src="\${team.logo}" alt="\${team.name} Logo" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-60 group-hover:opacity-80" />
            <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a]/40 to-transparent"></div>
            
            <!-- Overlay Team Info -->
            <div class="absolute bottom-0 left-0 p-8 w-full">
              <div class="flex justify-between items-end">
                <div>
                  <div class="flex items-center space-x-3 mb-2">
                    <span class="px-3 py-1 bg-purple-500/20 border border-purple-500/30 text-purple-300 text-xs font-bold uppercase tracking-wider rounded-md backdrop-blur-sm">
                      \${team.batch}
                    </span>
                    \${team.slogan ? \`
                      <span class="text-neutral-300 text-sm italic opacity-80 border-l border-neutral-700 pl-3">
                        "\${team.slogan}"
                      </span>
                    \` : ''}
                  </div>
                  <h2 class="text-4xl font-bold text-white tracking-tight">\${team.name}</h2>
                </div>
              </div>
            </div>
          </div>

          <!-- Card Body - Details & Voting -->
          <div class="p-8">
            <div class="grid grid-cols-[1fr_auto] gap-6 items-center">
              
              <!-- Captain & Contact Info -->
              <div class="flex items-center space-x-5 bg-white/5 border border-white/5 rounded-2xl p-4">
                <div class="relative w-16 h-16 rounded-full overflow-hidden border-2 border-neutral-700">
                  <img src="\${team.captainPhoto}" alt="\${team.captain} Photo" class="w-full h-full object-cover" />
                </div>
                <div>
                  <div class="flex items-center space-x-2 text-neutral-400 text-xs uppercase tracking-widest font-semibold mb-1">
                    <i data-lucide="shield" class="w-3 h-3"></i>
                    <span>Captain</span>
                  </div>
                  <p class="text-lg font-medium text-white">\${team.captain}</p>
                  <div class="flex items-center space-x-2 text-neutral-500 text-sm mt-0.5">
                    <i data-lucide="phone" class="w-3.5 h-3.5"></i>
                    <span>\${team.whatsapp}</span>
                  </div>
                </div>
              </div>

              <!-- Vote Stats & Action -->
              <div class="flex flex-col items-end space-y-3">
                <div class="flex items-center space-x-2 text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400">
                  <i data-lucide="trending-up" class="w-6 h-6 text-purple-400"></i>
                  <span>\${team.votes.toLocaleString()}</span>
                </div>
                
                <button
                  onclick="handleVote(\${index})"
                  \${team.hasVoted ? 'disabled' : ''}
                  class="relative overflow-hidden px-8 py-3 rounded-xl font-bold tracking-wide uppercase transition-all duration-300 \${
                    team.hasVoted 
                      ? 'bg-neutral-800 text-neutral-500 cursor-not-allowed border border-neutral-700' 
                      : 'bg-white text-black hover:bg-purple-100 hover:scale-105 active:scale-95 border border-transparent shadow-[0_0_20px_-5px_rgba(255,255,255,0.5)]'
                  }"
                >
                  \${team.hasVoted ? \`
                    <span class="flex items-center space-x-2">
                      <i data-lucide="trophy" class="w-4 h-4"></i>
                      <span>Voted</span>
                    </span>
                  \` : \`
                    <span>Vote Now</span>
                    <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/40 to-transparent group-hover:animate-shimmer"></div>
                  \`}
                </button>
              </div>
            </div>
          </div>
        \`;
        
        grid.appendChild(card);
      });
      
      lucide.createIcons();
    }

    // Handle Voting logic
    window.handleVote = function(index) {
      if(TEAMS[index].hasVoted) return;
      TEAMS[index].votes += 1;
      TEAMS[index].hasVoted = true;
      renderTeams();
    }

    // Initial render
    renderTeams();
  </script>
</body>
</html>
