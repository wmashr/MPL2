<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Premier League | Team Registration</title>
    
    <!-- Professional Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #D4AF37; /* Premium Gold */
            --primary-hover: #F1C40F;
            --bg-color: #0A0F1C; /* Deep Navy */
            --surface: rgba(18, 25, 43, 0.95);
            --surface-border: rgba(212, 175, 55, 0.2);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --input-bg: #0F1626;
            --input-border: #2A344A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at top right, rgba(212, 175, 55, 0.05), transparent 40%),
                radial-gradient(circle at bottom left, rgba(10, 15, 28, 0.8), transparent 40%),
                url('https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem 1rem;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 3.5rem;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), 0 0 20px rgba(212, 175, 55, 0.05);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .logo-img {
            width: 130px;
            height: auto;
            margin: 0 auto 1.5rem;
            display: block;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        .header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .form-section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .form-group:focus-within label {
            color: var(--primary);
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.3s;
            font-size: 1.1rem;
        }

        .form-group:focus-within .input-icon-wrapper i {
            color: var(--primary);
        }

        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
            background: #121A2F;
        }

        input::placeholder {
            color: rgba(148, 163, 184, 0.4);
            font-weight: 400;
        }

        /* Dual File Upload Styling */
        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 160px;
            border: 1px dashed var(--input-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--input-bg);
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            text-align: center;
            padding: 1rem;
        }

        .file-upload-wrapper:hover, .file-upload-wrapper.dragover {
            border-color: var(--primary);
            background: rgba(212, 175, 55, 0.05);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }

        .upload-content {
            z-index: 1;
            transition: opacity 0.3s;
        }

        .upload-icon {
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
            color: var(--primary);
        }

        .upload-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 0.2rem;
        }
        
        .upload-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .preview-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: none;
            z-index: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 1.25rem;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px rgba(212, 175, 55, 0.6);
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(212, 175, 55, 0.8);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Success Message */
        #successMessage {
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34D399;
            padding: 1.2rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }

        @media (max-width: 650px) {
            .form-row, .upload-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .container {
                padding: 2.5rem 1.5rem;
            }
            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="mpl_logo.png" alt="MPL Logo" class="logo-img" onerror="this.style.display='none'">
            <h1>Master Premier League</h1>
            <p>Official Team Registration Portal</p>
        </div>

        <div id="successMessage">
            <i class="fas fa-check-circle" style="margin-right: 8px;"></i> Registration submitted successfully! Data has been sent to the registry.
        </div>

        <form id="mplForm" onsubmit="handleSubmit(event)">
            
            <div class="form-section-title">Team Information</div>
            
            <div class="form-row">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="teamName">Team Name</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-shield-alt"></i>
                        <input type="text" id="teamName" required placeholder="e.g. Royal Strikers">
                    </div>
                </div>
                
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="batchName">Batch</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-users"></i>
                        <input type="text" id="batchName" required placeholder="e.g. 27-KANDY">
                    </div>
                </div>
            </div>

            <div class="form-section-title" style="margin-top: 2rem;">Captain Details</div>

            <div class="form-row">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="captainName">Full Name</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-user-tie"></i>
                        <input type="text" id="captainName" required placeholder="John Doe">
                    </div>
                </div>
                
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="whatsappNumber">WhatsApp Number</label>
                    <div class="input-icon-wrapper">
                        <i class="fab fa-whatsapp" style="font-size: 1.2rem;"></i>
                        <input type="tel" id="whatsappNumber" required placeholder="+1 234 567 8900">
                    </div>
                </div>
            </div>

            <div class="form-section-title" style="margin-top: 2rem;">Media Assets</div>
            
            <div class="upload-grid">
                <!-- Team Logo Upload -->
                <div class="file-upload-wrapper" id="dropZoneLogo">
                    <input type="file" id="teamLogo" accept="image/*" required onchange="handleFileSelect(event, 'previewLogo', 'contentLogo')">
                    <div class="upload-content" id="contentLogo">
                        <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                        <div class="upload-title">Team Logo</div>
                        <div class="upload-subtitle">Tap to upload</div>
                    </div>
                    <img id="previewLogo" class="preview-image" alt="Logo Preview">
                </div>

                <!-- Captain Photo Upload -->
                <div class="file-upload-wrapper" id="dropZoneCaptain">
                    <input type="file" id="captainPhoto" accept="image/*" required onchange="handleFileSelect(event, 'previewCaptain', 'contentCaptain')">
                    <div class="upload-content" id="contentCaptain">
                        <div class="upload-icon"><i class="fas fa-camera"></i></div>
                        <div class="upload-title">Captain's Photo</div>
                        <div class="upload-subtitle">Tap to upload</div>
                    </div>
                    <img id="previewCaptain" class="preview-image" alt="Captain Preview">
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit Registration</button>
        </form>
    </div>

    <script>
        // --- Image Preview Logic ---
        function handleFileSelect(event, previewId, contentId) {
            const file = event.target.files[0];
            const preview = document.getElementById(previewId);
            const content = document.getElementById(contentId);

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    content.style.opacity = '0';
                }
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
                content.style.opacity = '1';
            }
        }

        // Add drag & drop styles
        const addDragEvents = (zoneId) => {
            const dropZone = document.getElementById(zoneId);
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
            });
            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
            });
        };

        addDragEvents('dropZoneLogo');
        addDragEvents('dropZoneCaptain');

        // --- File to Base64 Converter ---
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) {
                    resolve(null);
                    return;
                }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); 
                reader.onerror = error => reject(error);
            });
        }

        // The URL provided by the user
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx12m4hBHMErIJN9KPm-t8NXOeq9902RzcOGVA2ErFgBuMmi8C4WVW96LNhMw9CmY0O/exec'; 

        async function handleSubmit(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            try {
                // Get Field Values
                const teamName = document.getElementById('teamName').value;
                const batchName = document.getElementById('batchName').value;
                const captainName = document.getElementById('captainName').value;
                const whatsapp = document.getElementById('whatsappNumber').value;

                // Process Images
                const logoFile = document.getElementById('teamLogo').files[0];
                const captainFile = document.getElementById('captainPhoto').files[0];
                
                const logoBase64 = await getBase64(logoFile);
                const captainBase64 = await getBase64(captainFile);
                const logoMime = logoFile ? logoFile.type : '';
                const logoName = logoFile ? logoFile.name : '';
                const captainMime = captainFile ? captainFile.type : '';
                const captainNameFile = captainFile ? captainFile.name : '';

                const formData = {
                    teamName: teamName,
                    batch: batchName,
                    captainName: captainName,
                    whatsapp: whatsapp, // New Whatsapp field
                    logoData: logoBase64,
                    logoMime: logoMime,
                    logoName: logoName,
                    captainPhotoData: captainBase64,
                    captainMime: captainMime,
                    captainPhotoName: captainNameFile
                };

                // Send Data to Google Apps Script
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                showSuccess();

            } catch (error) {
                console.error('Error submitting form:', error);
                alert('There was an error saving to the registry. Please check your connection.');
                btn.innerHTML = 'Submit Registration';
                btn.disabled = false;
            }
        }

        function showSuccess() {
            document.getElementById('mplForm').reset();
            document.getElementById('successMessage').style.display = 'block';
            
            // Reset Images
            document.getElementById('previewLogo').style.display = 'none';
            document.getElementById('contentLogo').style.opacity = '1';
            document.getElementById('previewCaptain').style.display = 'none';
            document.getElementById('contentCaptain').style.opacity = '1';

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'Submit Registration';
            btn.disabled = false;

            // Hide success after 5 seconds
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
